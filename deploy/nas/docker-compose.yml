# The Show Verse — stack autoalojado en el NAS (UGREEN DXP 4800 Plus).
# Solo la web (3000) se expone; backend/postgres/redis quedan en la red interna.
# Ejecutar desde la raíz del repo en el NAS:
#   docker compose -f deploy/nas/docker-compose.yml up -d --build
name: theshowverse

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: tsv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: theshowverse
    volumes:
      # PG18+: la imagen guarda los datos en /var/lib/postgresql/<major>/docker,
      # por lo que el volumen se monta en /var/lib/postgresql (no en .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsv -d theshowverse"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
      dockerfile: ../deploy/nas/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ./backend.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3001"

  web:
    build:
      context: ../..
      dockerfile: ./deploy/nas/Dockerfile.web
      args:
        NEXT_PUBLIC_TMDB_API_KEY: ${NEXT_PUBLIC_TMDB_API_KEY}
        NEXT_PUBLIC_API_BASE_URL: http://backend:3001
    restart: unless-stopped
    env_file:
      - ./web.env
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      default:
        aliases:
          # Alias para que la ruta del túnel `http://the-show-verse:3000`
          # (config previa) resuelva a esta web sin cambiar el panel de Cloudflare.
          - the-show-verse

  # Cloudflare Tunnel: expone la web a Internet (theshowverse.com) sin abrir
  # puertos, con TLS gestionado por Cloudflare. El hostname público se configura
  # en el panel de Cloudflare apuntando al servicio HTTP `web:3000`.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?define CF_TUNNEL_TOKEN en .env}
    depends_on:
      - web

  # Ollama — LLM local para las funciones de IA (reutiliza los modelos ya bajados).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"

  # GitHub Actions self-hosted runner (CI/CD del repo). Mantiene el registro
  # existente (volumen runner-data) y despliega en la carpeta NUEVA (/nas-deploy).
  github-runner:
    image: myoung34/github-runner:latest
    restart: unless-stopped
    env_file:
      - ./runner.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-data:/home/runner
      - /volume4/docker/theshowverse:/nas-deploy

volumes:
  pgdata:
  redisdata:
  # Volúmenes existentes del stack antiguo, reutilizados como externos para no
  # perder los modelos de Ollama ni el registro del runner.
  ollama-data:
    external: true
    name: showverse-ollama-data
  runner-data:
    external: true
    name: the-show-verse_runner-data
