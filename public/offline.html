<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Sin conexión • The Show Verse</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%;
        background: #000; color: #fff;
        font-family: "PT Sans", Arial, Helvetica, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        text-align: center; padding: 24px; gap: 14px;
      }
      .dot {
        width: 54px; height: 54px; border-radius: 9999px;
        background: radial-gradient(circle at 30% 30%, #10b981, #065f46);
        box-shadow: 0 12px 40px -12px rgba(16, 185, 129, 0.7);
        margin-bottom: 6px;
      }
      h1 { font-size: 20px; margin: 0; font-weight: 700; }
      p { margin: 0; max-width: 340px; color: #cbd5e1; font-size: 14px; line-height: 1.5; }
      button {
        margin-top: 10px; padding: 10px 20px; border: 0; border-radius: 12px;
        background: #fff; color: #000; font-weight: 700; font-size: 14px; cursor: pointer;
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="dot"></div>
      <h1>No hay conexión con el servidor</h1>
      <p>
        Esta pantalla aún no se había guardado para verse sin conexión. Abre
        primero las páginas que quieras tener disponibles offline; después
        podrás navegarlas aunque el servidor esté apagado.
      </p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
